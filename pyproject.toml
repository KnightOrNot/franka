[project]
name = "franka-capture"
version = "0.4.1"
description = "Controller-side Franka RGB-D capture and LeRobot dataset export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["camera-realsense-d435i", "numpy>=2,<3", "pillow>=11,<13"]

[project.optional-dependencies]
camera = ["camera-realsense-d435i[server]"]
export = ["lerobot[dataset]==0.6.1", "torch>=2.2.1,<2.12", "torchvision>=0.21,<0.27"]

[project.scripts]
franka-capture = "franka_capture.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
camera-realsense-d435i = { git = "https://github.com/KnightOrNot/camera-realsense-d435i.git", rev = "c8136dfe886b163dd7dbce15e9dafa343865d22f" }
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
